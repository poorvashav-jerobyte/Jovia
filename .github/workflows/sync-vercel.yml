
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jovia-vercel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync original files to Vercel repository
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          set -euo pipefail

          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: AUTO_SYNC_JOVIA secret is missing"
            exit 1
          fi

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch https://github.com/PoorvashaV/jovia.git \
            +refs/heads/main:refs/remotes/vercel/main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B deployment-sync vercel/main

          git rm -r --quiet --ignore-unmatch .

          git clean -fd

          git checkout "$GITHUB_SHA" -- .

          git add -A

          if git diff --cached --quiet; then
            echo "No file changes to sync"
            exit 0
          fi

          git commit -m "Sync source from ${GITHUB_SHA}"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push https://github.com/PoorvashaV/jovia.git \
            HEAD:main

          echo "Vercel repository synchronized successfully"
