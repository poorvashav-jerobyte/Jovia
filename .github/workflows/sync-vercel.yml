
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push changes to Vercel repository
        env:
          SYNC_TOKEN: ${{ secrets.JOVIA_SYNC_TOKEN }}
        run: |
          git remote add vercel \
            "https://x-access-token:${SYNC_TOKEN}@github.com/PoorvashaV/jovia.git"

          git push vercel HEAD:main
