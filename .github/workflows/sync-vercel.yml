
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify destination access
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: AUTO_SYNC_JOVIA secret is empty"
            exit 1
          fi

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            ls-remote https://github.com/PoorvashaV/jovia.git HEAD \
            >/dev/null

          echo "Destination access successful"

      - name: Sync to Vercel repository
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push https://github.com/PoorvashaV/jovia.git HEAD:main
