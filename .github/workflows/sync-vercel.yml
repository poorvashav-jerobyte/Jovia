
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token and destination access
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: AUTO_SYNC_JOVIA secret is missing or empty"
            exit 1
          fi

          echo "Token is available"

          git -c credential.helper= \
            ls-remote \
            "https://x-access-token:${SYNC_TOKEN}@github.com/PoorvashaV/jovia.git" \
            HEAD >/dev/null || {
              echo "ERROR: Cannot access destination repository"
              exit 1
            }

          echo "Destination repository access verified"

      - name: Push changes to Vercel repository
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          git remote add vercel \
            "https://x-access-token:${SYNC_TOKEN}@github.com/PoorvashaV/jovia.git"

          git -c credential.helper= push vercel HEAD:main
