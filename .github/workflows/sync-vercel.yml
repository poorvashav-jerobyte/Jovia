
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify destination access
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: AUTO_SYNC_JOVIA secret is empty"
            exit 1
          fi

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            ls-remote \
            https://github.com/PoorvashaV/jovia.git \
            HEAD >/dev/null

          echo "Destination repository access successful"

      - name: Compare repository histories
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          set -e

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          echo "Fetching Vercel repository history..."

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch \
            https://github.com/PoorvashaV/jovia.git \
            +refs/heads/main:refs/remotes/vercel/main

          echo ""
          echo "=== ORIGINAL ONLY COMMITS ==="

          git log --oneline vercel/main..HEAD

          echo ""
          echo "=== VERCEL ONLY COMMITS ==="

          git log --oneline HEAD..vercel/main

          echo ""
          echo "=== COMMON ANCESTOR ==="

          if git merge-base HEAD vercel/main; then
            echo "Common history found"
          else
            echo "No common ancestor found"
          fi

          echo ""
          echo "=== REPOSITORY STATUS ==="

          if git merge-base --is-ancestor vercel/main HEAD; then
            echo "FAST_FORWARD_POSSIBLE"
          elif git merge-base --is-ancestor HEAD vercel/main; then
            echo "VERCEL_REPOSITORY_AHEAD"
          else
            echo "HISTORIES_DIVERGED"
          fi

          echo ""
          echo "Comparison completed successfully"
          echo "No changes pushed to destination repository"
