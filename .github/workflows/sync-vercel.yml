
name: Sync Jovia to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify destination access
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          set -e

          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: AUTO_SYNC_JOVIA secret is missing"
            exit 1
          fi

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            ls-remote https://github.com/PoorvashaV/jovia.git HEAD \
            >/dev/null

          echo "Destination access verified"

      - name: Establish common repository history and sync
        env:
          SYNC_TOKEN: ${{ secrets.AUTO_SYNC_JOVIA }}
        run: |
          set -e

          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w 0)

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch https://github.com/PoorvashaV/jovia.git \
            +refs/heads/main:refs/remotes/vercel/main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge-base HEAD vercel/main >/dev/null; then
            echo "Unrelated histories detected"

            git merge -s ours \
              --allow-unrelated-histories \
              --no-edit \
              vercel/main
          else
            echo "Common history already exists"
          fi

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push https://github.com/PoorvashaV/jovia.git HEAD:main

          echo "Synchronization completed"
